[project]
name = "yach"
version = "0.1.0"
description = "A hyper-minimal coding agent for the terminal, with auto-approval, dcg, sandboxing and sessions"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "anthropic>=2.6.0",
]

[project.scripts]
yach = "yach:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["yach.py"]
